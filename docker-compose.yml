services:
  db:
    image: postgres:16-alpine
    container_name: sigecosem-db
    network_mode: host
    environment:
      POSTGRES_USER: sigecosem_admin
      POSTGRES_PASSWORD: SecretPassword123!
      POSTGRES_DB: sigecosem_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U sigecosem_admin -d sigecosem_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: sigecosem-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    container_name: sigecosem-backend
    network_mode: host
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://127.0.0.1:5000
      - ConnectionStrings__DefaultConnection=Host=127.0.0.1;Database=sigecosem_db;Username=sigecosem_admin;Password=SecretPassword123!;Port=5432
      - Jwt__Key=SigecosemSuperSecretKeyEnterpriseERP2026!
      - Jwt__Issuer=sigecosem-api
      - Jwt__Audience=sigecosem-app
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
      - backend_backups:/app/backups
    restart: always

  nginx:
    image: nginx:alpine
    container_name: sigecosem-nginx
    network_mode: host
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
  backend_uploads:
  backend_backups:
